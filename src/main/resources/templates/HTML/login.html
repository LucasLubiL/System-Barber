<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/CSS/login.css}">
    <title>Login</title>
</head>

<body>

    <form class="form" th:action="@{/login}" method="post">

        <p class="title">Login</p>
        <p class="message">Bem vindo de volta! Faça login para acessar a sua conta.</p>

        <!-- Mensagem de erro -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Mensagem de sucesso -->
        <div th:if="${successMessage}" class="alert alert-success" role="alert">
            <span th:text="${successMessage}"></span>
        </div>

        <label>
            <input class="input" type="text" name="username" placeholder=" " required>
            <span>E-mail</span>
        </label>

        <label>
            <input class="input" type="password" name="password" placeholder=" " required>
            <span>Senha</span>
        </label>

        <button class="submit" type="submit">Login</button>

        <p class="signin">Não tem uma conta? <a th:href="@{/register}">Cadastre-se</a></p>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
