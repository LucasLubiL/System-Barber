<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/CSS/login.css}">
    <title>Registrar</title>
</head>

<body>

    <form class="form" th:action="@{/saveUser}" method="post" th:object="${registerUser}">
        <p class="title">Register </p>
        <p class="message">Seja Bem Vindo! Crie agora mesmo sua conta para agendar horários. </p>
        
        <!-- Mensagem de erro do backend -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>
        
        <label>
            <input class="input" type="text" id="nomeCompleto" th:field="*{nomeCompleto}" placeholder="" required>
            <span>Nome Completo</span>
            <p th:if="${#fields.hasErrors('nomeCompleto')}" th:errorclass="text-danger" th:errors="*{nomeCompleto}" />
        </label>

        <div class="flex">
            <label>
                <input class="input" type="text" id="telefone" th:field="*{telefone}" placeholder="" required>
                <span>Telefone</span>
                <p th:if="${#fields.hasErrors('telefone')}" th:errorclass="text-danger" th:errors="*{telefone}" />
            </label>
            <label>
                <input class="input" type="text" id="cpf" th:field="*{cpf}" placeholder="" required maxlength="14">
                <span>CPF</span>
                <p th:if="${#fields.hasErrors('cpf')}" th:errorclass="text-danger" th:errors="*{cpf}" />
            </label>
        </div>
        
        <label>
            <input class="input" type="date" id="dataNascimento" th:field="*{dataNascimento}" placeholder="" required>
            <span>Data de Nascimento</span>
            <p th:if="${#fields.hasErrors('dataNascimento')}" th:errorclass="text-danger" th:errors="*{dataNascimento}" />
        </label>

        <label>
            <input class="input" type="email" id="email" th:field="*{email}" placeholder="" required>
            <span>E-mail</span>
            <p th:if="${#fields.hasErrors('email')}" th:errorclass="text-danger" th:errors="*{email}" />
        </label>

        <label>
            <input class="input" type="password" id="senha" th:field="*{senha}" placeholder="" required>
            <span>Senha</span>
            <p th:if="${#fields.hasErrors('senha')}" th:errorclass="text-danger" th:errors="*{senha}" />
        </label>
        
        <label>
            <input class="input" type="password" id="confirmarSenha" name="confirmarSenha" placeholder="" required>
            <span>Confirmar senha</span>
        </label>
        
        <button class="submit" type="submit">Submit</button>
        <p class="signin">Já tem uma conta ? <a th:href="@{/login}">login</a> </p>
    </form>

</body>
</html>
