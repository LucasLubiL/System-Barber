<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil do Cliente - Barbearia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../CSS/clienteAgendamento.css">
    <link rel="stylesheet" href="../CSS/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<th:block th:replace="~{/../fragments/head :: head('Perfil Cliente')}"></th:block>

<body>

    <th:block th:replace="~{/../fragments/head :: header}"></th:block>

    <div class="container">
        <!-- Cabeçalho com informações do cliente -->
        <div class="Lal_header">
            <div class="Lal_profileHeader">
                <img th:if="${registerUser.foto != null}" 
                     th:src="@{${registerUser.foto}}" 
                     alt="Foto do cliente" 
                     class="Lal_profileImg" 
                     id="Lal_profileImg">
                <div th:if="${registerUser.foto == null}" class="Lal_profileImg" style="background: #ddd; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-person" style="font-size: 3rem; color: #999;"></i>
                </div>
                <div class="Lal_profileInfo">
                    <h1 id="Lal_profileName" th:text="${registerUser.nomeCompleto}">Cliente</h1>
                </div>
            </div>

            <button class="btn-edit-profile" data-bs-toggle="modal" data-bs-target="#editarPerfilModal">
                <i class="bi bi-pencil-square"></i> Editar Perfil
            </button>
        </div>

        <!-- Seção de informações pessoais -->
        <div class="Lal_section">
            <h2 class="Lal_sectionTitle">
                <i class="bi bi-person-circle"></i> Informações Pessoais
            </h2>

            <div class="Lal_profileDetails">
                <div class="Lal_detailItem">
                    <div class="Lal_detailLabel">Nome Completo</div>
                    <div class="Lal_detailValue" id="Lal_detailName" th:text="${registerUser.nomeCompleto}"></div>
                </div>
                <div class="Lal_detailItem">
                    <div class="Lal_detailLabel">Data de Nascimento</div>
                    <div class="Lal_detailValue" id="Lal_detailBirthdate" th:text="${registerUser.dataNascimento}"></div>
                </div>
                <div class="Lal_detailItem">
                    <div class="Lal_detailLabel">CPF</div>
                    <div class="Lal_detailValue" id="Lal_detailCpf" th:text="${registerUser.cpf}"></div>
                </div>
                <div class="Lal_detailItem">
                    <div class="Lal_detailLabel">Telefone</div>
                    <div class="Lal_detailValue" id="Lal_detailPhone" th:text="${registerUser.telefone}"></div>
                </div>
                <div class="Lal_detailItem">
                    <div class="Lal_detailLabel">E-mail</div>
                    <div class="Lal_detailValue" id="Lal_detailEmail" th:text="${registerUser.email}"></div>
                </div>
            </div>
        </div>

        <!-- Seção de agendamentos em aberto -->
        <div class="Lal_section">
            <h2 class="Lal_sectionTitle">
                <i class="bi bi-calendar-check"></i> Próximos Agendamentos
            </h2>

            <div id="Lal_upcomingList" class="Lal_agendamentosList">
                <!-- Renderize aqui os .Lal_agendamentoItem pelo servidor (se houver) -->
            </div>

            <button class="Lal_btnAgendar" id="Lal_btnNovoAgendamento" type="button">
                <i class="bi bi-plus-circle"></i> Novo Agendamento
            </button>
        </div>

        <!-- Seção de histórico de agendamentos -->
        <div class="Lal_section">
            <h2 class="Lal_sectionTitle">
                <i class="bi bi-clock-history"></i> Histórico de Agendamentos
            </h2>

            <div id="Lal_historyList" class="Lal_agendamentosList">
                <!-- Renderize aqui os .Lal_agendamentoItem pelo servidor (se houver) -->
            </div>
        </div>
    </div>

    <!-- Modal Editar Perfil -->
    <div class="modal fade" id="editarPerfilModal" tabindex="-1" aria-labelledby="editarPerfilModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editarPerfilModalLabel">Editar Perfil</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>

                <!-- FORM preserved (não modifiquei ids/names dentro do form) -->
                <form id="profile-form" th:action="@{/putUser}" method="post" th:object="${registerUser}" enctype="multipart/form-data">
                    <input type="hidden" name="id" th:value="${registerUser.id}">

                    <div class="modal-body">
                        <div class="text-center mb-4">
                            <!-- Mostra a foto se existir, senão mostra o ícone -->
                            <img th:if="${registerUser.foto != null}" 
                                 th:src="@{${registerUser.foto}}" 
                                 alt="Foto do cliente" 
                                 class="profile-img-preview" 
                                 id="profile-img-preview"
                                 style="width: 150px; height: 150px; object-fit: cover; border-radius: 50%; display: block; margin: 0 auto;">

                            <div th:if="${registerUser.foto == null}" 
                                 id="profile-img-preview"
                                 style="width: 150px; height: 150px; background: #ddd; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
                                <i class="bi bi-person" style="font-size: 4rem; color: #999;"></i>
                            </div>
                            
                            <div class="mt-2">
                                <label class="form-label d-block mb-1">Alterar foto</label>
                                <input type="file" name="foto" id="photo-input" accept="image/*"
                                    class="form-control form-control-sm">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nomeCompleto" class="form-label">Nome Completo</label>
                                <input name="nomeCompleto" type="text" class="form-control" id="nomeCompleto"
                                    th:value="${registerUser.nomeCompleto}" placeholder="Digite o nome completo">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                                <input name="dataNascimento" type="date" class="form-control" id="dataNascimento"
                                    th:value="${registerUser.dataNascimento}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cpf" class="form-label">CPF</label>
                                <input name="cpf" type="text" class="form-control" id="cpf"
                                    th:value="${registerUser.cpf}" placeholder="000.000.000-00">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input name="telefone" type="tel" class="form-control" id="telefone"
                                    th:value="${registerUser.telefone}" placeholder="(00) 00000-0000">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input name="email" type="email" class="form-control" id="email"
                                th:value="${registerUser.email}" placeholder="email@exemplo.com">
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-edit-profile">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de Sucesso -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h1 class="modal-title fs-5" id="successModalLabel">
                        <i class="bi bi-check-circle-fill me-2"></i>Perfil Atualizado com Sucesso!
                    </h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <i class="bi bi-check-circle text-success" style="font-size: 4rem;"></i>
                    <h4 class="mt-3">Suas informações foram atualizadas!</h4>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{/../fragments/footer :: footer}"></th:block>

    <!-- Bootstrap JS (UMA VEZ SÓ) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        // PREVIEW DA FOTO QUANDO SELECIONAR
       document.getElementById('photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const preview = document.getElementById('profile-img-preview');
                    
                    // Se for uma div (ícone), troca por img
                    if (preview.tagName === 'DIV') {
                        const newImg = document.createElement('img');
                        newImg.id = 'profile-img-preview';
                        newImg.className = 'profile-img-preview';
                        newImg.style.cssText = 'width: 150px; height: 150px; object-fit: cover; border-radius: 50%; display: block; margin: 0 auto;';
                        newImg.src = event.target.result;
                        preview.replaceWith(newImg);
                    } else {
                        preview.src = event.target.result;
                    }
                };
                reader.readAsDataURL(file);
            }
        });
        // MOSTRA O MODAL QUANDO success=true NA URL
        window.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                const successModal = new bootstrap.Modal(document.getElementById('successModal'));
                successModal.show();
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        // Gerencia estado vazio das listas (IDs atualizados)
        (function () {
            function ensureEmptyState(listId, emptyIconClass, titleText, messageText) {
                const listEl = document.getElementById(listId);
                if (!listEl) return;

                const hasItems = listEl.querySelectorAll('.Lal_agendamentoItem').length > 0;
                const existingEmpty = listEl.querySelector('.Lal_emptyState');

                if (hasItems) {
                    if (existingEmpty) existingEmpty.remove();
                    return;
                }

                if (!existingEmpty) {
                    const emptyState = document.createElement('div');
                    emptyState.className = 'Lal_emptyState';
                    emptyState.innerHTML = `
                        <i class="${emptyIconClass}"></i>
                        <h4>${titleText}</h4>
                        <p>${messageText}</p>
                    `;
                    listEl.appendChild(emptyState);
                }
            }

            ensureEmptyState('Lal_upcomingList', 'bi bi-calendar-x', 'Nenhum agendamento', 'Você não possui agendamentos futuros.');
            ensureEmptyState('Lal_historyList', 'bi bi-journal-x', 'Nenhum histórico', 'Seu histórico de agendamentos aparecerá aqui.');
        })();
    </script>

</body>

</html>
